# Dependabot version updates: opens pull requests when pinned versions fall
# behind, so updates arrive through the same reviewed workflow as any change
# (RA-5, SI-2, CM-3). Security alerts and security updates are enabled
# separately in the repository settings.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/init and .../analyze must stay on the same
      # version (security-checks.yml fails its "Code scanning" check if
      # they drift, as happened with #48 and #50 opening separately for
      # a single matched-version bump). One PR, both files, every time.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: terraform
    directories:
      - /infrastructure/bootstrap
      - /infrastructure/environments/dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
