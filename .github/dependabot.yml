# Dependabot version updates: opens pull requests when pinned versions fall
# behind, so updates arrive through the same reviewed workflow as any change
# (RA-5, SI-2, CM-3). Security alerts and security updates are enabled
# separately in the repository settings.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
