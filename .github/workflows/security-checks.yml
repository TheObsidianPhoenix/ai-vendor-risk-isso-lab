# Automated checks that run on every pull request and every change to main.
#
# Security notes:
# - Every third-party action is pinned to a full commit SHA, not a tag, so a
#   moved or hijacked tag can't change what runs (supply chain: SR-17, SR-15).
# - The workflow token is read-only by default. Each job asks only for the
#   extra permission it needs (least privilege: AC-6).
# - No secrets or cloud credentials are used here. AWS access arrives in
#   Milestone 3 through short-lived OIDC credentials, never stored keys.

name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1" # Weekly, Monday 14:17 UTC: catches newly published vulnerabilities

permissions:
  contents: read

jobs:
  sample-data:
    name: Sample data is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compare committed documents with the generator's output (by content)
        run: python scripts/verify_sample_data.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  codeql:
    name: Code scanning (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Upload findings to the repository's Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Post a summary comment on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Static checks only: no AWS credentials, nothing is planned or applied here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: Formatting
        run: |
          if ! files=$(terraform fmt -check -recursive infrastructure); then
            echo "::error title=terraform fmt::Not formatted: $(echo $files)"
            exit 1
          fi
      - name: Validate each root configuration
        # Errors are also posted as annotations, so they show on the pull request
        run: |
          status=0
          for dir in infrastructure/bootstrap infrastructure/environments/dev; do
            echo "::group::$dir"
            if ! out=$( { terraform -chdir="$dir" init -backend=false -input=false -no-color && terraform -chdir="$dir" validate -no-color; } 2>&1 ); then
              status=1
              echo "$out"
              msg=$(echo "$out" | grep -v '^$' | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error title=terraform validate ($dir)::$msg"
            else
              echo "$out"
            fi
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Security scan (Checkov)
        # Any finding fails the job. Accepted gaps are skipped inline in the
        # Terraform, each with its reason, so they show up in review.
        run: |
          python -m pip install --quiet checkov==3.3.28
          checkov --directory infrastructure --framework terraform --output json --soft-fail > checkov.json
          python - <<'PY'
          import json, sys
          data = json.load(open("checkov.json"))
          reports = data if isinstance(data, list) else [data]
          failed = [f for r in reports for f in r.get("results", {}).get("failed_checks", [])]
          passed = sum(len(r.get("results", {}).get("passed_checks", [])) for r in reports)
          skipped = sum(len(r.get("results", {}).get("skipped_checks", [])) for r in reports)
          print(f"::notice title=Checkov::{passed} passed, {len(failed)} failed, {skipped} skipped with a written reason")
          for f in failed:
              where = "infrastructure" + f.get("repo_file_path", "")
              line = (f.get("file_line_range") or [1])[0]
              print(f"::error file={where},line={line},title={f['check_id']}::{f['check_name']} ({f['resource']})")
          sys.exit(1 if failed else 0)
          PY
