# Automated checks that run on every pull request and every change to main.
#
# Security notes:
# - Every third-party action is pinned to a full commit SHA, not a tag, so a
#   moved or hijacked tag can't change what runs (supply chain: SR-17, SR-15).
# - The workflow token is read-only by default. Each job asks only for the
#   extra permission it needs (least privilege: AC-6).
# - No secrets or cloud credentials are used here. AWS access arrives in
#   Milestone 3 through short-lived OIDC credentials, never stored keys.

name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1" # Weekly, Monday 14:17 UTC: catches newly published vulnerabilities

permissions:
  contents: read

jobs:
  sample-data:
    name: Sample data is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compare committed documents with the generator's output (by content)
        run: python scripts/verify_sample_data.py

  codeql:
    name: Code scanning (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Upload findings to the repository's Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Post a summary comment on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
